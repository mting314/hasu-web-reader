[project]
name = "hasu-web-reader-tools"
version = "0.1.0"
description = "Data and asset tooling for hasu-web-reader (scenario compiler, asset cache, Unity bundle exporters)"
requires-python = ">=3.11"
dependencies = [
    "UnityPy==1.25.4", # reading the game's Unity asset bundles (data-inspect/ios-full)
    "numpy>=2",        # curve decoding / pose math in the exporters
    "pygltflib>=1.16", # writing GLBs (scripts/export_costume.py)
]

[dependency-groups]
# wordfreq: only to regenerate data_cache/wordfreq_ja.json (the cached table is committed).
# pyyaml: build_story_index.py reads the decoded master data (link-like-diff YAML).
data = [
    "pyyaml>=6.0.4",
    "wordfreq>=3",
]
docs = [
    "matplotlib>=3.11.2",
]
# sssekai: Project Sekai's EN asset CDN handshake + bundle de-obfuscation (scripts/pjsk_fetch.py).
pjsk = [
    "sssekai>=0.8.4",
    "requests>=2.31",
]

[tool.uv]
package = false
